[package]
name = "relay"
version = "0.5.10"
edition = "2024"
rust-version = "1.94"
description = "A remote connection workspace for RDP and SSH on Windows, macOS, and Linux"
repository = "https://github.com/nurlennart/relay"
license = "MIT"
publish = false

[features]
ui-check = ["dep:image"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
csv = "1.3"
dirs = "6"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
encoding_rs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
keyring = "4.2"
portable-pty = "0.9"
raw-window-handle = "0.6.2"
rfd = { version = "0.17", default-features = false }
rusqlite = { version = "0.38", features = ["bundled"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
ttf-parser = "0.25"
vt100 = "0.16"

# Each platform gets its native GPU backend and TLS stack. Windows also hosts the
# Microsoft RDP ActiveX control and supports integrated MSSQL authentication.
[target.'cfg(windows)'.dependencies]
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "winauth", "sql-browser-tokio"] }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }
windows-core = "0.61.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Security_Credentials", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

# Elsewhere remote desktops are drawn by IronRDP. Its crates require Rust 1.94.
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3.7", default-features = false }
ironrdp-cliprdr = "0.8"
ironrdp-connector = "0.11"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.9"
ironrdp-dvc = "0.9"
ironrdp-graphics = "0.10"
ironrdp-input = "0.8"
ironrdp-mstsgu = { version = "0.0.2", features = ["rustls"] }
ironrdp-pdu = "0.10"
ironrdp-session = "0.12"
ironrdp-svc = "0.9"
ironrdp-tls = { version = "0.3", features = ["rustls"] }
ironrdp-tokio = "0.11"
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "sql-browser-tokio"] }
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls"] }
eframe = { version = "0.33.3", default-features = false, features = ["wayland", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "sql-browser-tokio"] }
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "wgsl"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
lto = "thin"
