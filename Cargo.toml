[package]
name = "relay"
version = "0.2.5"
edition = "2024"
description = "A native Windows RDP and SSH connection workspace"

[features]
ui-check = ["dep:image"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
raw-window-handle = "0.6.2"
portable-pty = "0.9"
vt100 = "0.16"
csv = "1.3"
encoding_rs = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "winauth"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.61.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_Security_Cryptography"] }

[profile.release]
strip = true
lto = "thin"

