name: Release

# Pushing a tag such as v0.3.0 builds every platform and publishes a GitHub release.
# Pull requests that touch packaging, and manual runs, build the same archives without
# publishing them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.name == 'macos-universal' && ',x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        if: matrix.name != 'macos-universal'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows
        if: startsWith(matrix.name, 'windows')
        run: |
          mkdir -p dist
          7z a "dist/relay-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip" \
            "./target/${{ matrix.target }}/release/relay.exe" README.md

      - name: Package macOS
        if: matrix.name == 'macos-universal'
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p dist build
          lipo -create -output build/relay \
            target/aarch64-apple-darwin/release/relay \
            target/x86_64-apple-darwin/release/relay
          sh packaging/macos/bundle.sh build/relay "${{ steps.version.outputs.version }}" build
          ditto -c -k --keepParent build/Relay.app \
            "dist/relay-${{ steps.version.outputs.version }}-${{ matrix.name }}.zip"

      - name: Package Linux
        if: startsWith(matrix.name, 'linux')
        run: |
          name="relay-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "build/$name" dist
          cp "target/${{ matrix.target }}/release/relay" README.md "build/$name/"
          cp packaging/linux/relay.desktop packaging/linux/install.sh "build/$name/"
          cp assets/icon.png "build/$name/relay.png"
          tar -C build -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "Relay ${GITHUB_REF_NAME#v}" \
            --generate-notes
