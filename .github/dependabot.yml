version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      ironrdp:
        patterns:
          - "ironrdp-*"
        update-types:
          - "minor"
          - "major"
      windows-com:
        patterns:
          - "windows"
          - "windows-core"
        update-types:
          - "minor"
          - "major"
      cargo-patches:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
